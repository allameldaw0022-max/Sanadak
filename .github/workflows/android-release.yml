name: Android TWA Release Build

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-aab:
    name: Build signed AAB
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses & install platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Point Gradle at the Android SDK
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode release keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Configure it in the 'android-release' environment before running this workflow."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Write signing properties
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=android.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanadak-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # A .aab is Play Store-only and can't be sideloaded directly. This
      # produces a real installable, signed .apk from the exact same
      # signingConfig/keystore.properties written above -- same secrets,
      # same certificate (verified: A7:59:A9:05:7B:38:D4:63:F1:6F:FF:E1:1C:
      # 3E:D4:32:2E:9D:9D:49:5E:EB:9B:E4:D5:23:42:E7:81:D4:5E:D2, matching
      # public/.well-known/assetlinks.json), just a different Gradle task.
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanadak-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Clean up signing material
        if: always()
        working-directory: android
        run: shred -u android.keystore keystore.properties 2>/dev/null || rm -f android.keystore keystore.properties
